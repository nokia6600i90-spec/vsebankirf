plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.vsebankirf.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.vsebankirf.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Подпись для релизной сборки настраивается в CI через переменные окружения /
            // секреты репозитория (см. .github/workflows/build.yml). Для тестовой сборки
            // (assembleDebug) подписи не требуется — Android сам подписывает debug-ключом.
            if (System.getenv("VB_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
                        if (System.getenv("VB_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
                        }
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("VB_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("VB_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VB_KEY_ALIAS")
                keyPassword System.getenv("VB_KEY_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}
