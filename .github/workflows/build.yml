name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.VB_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vsebankirf-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore (if configured)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.VB_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Build signed release AAB (if configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          VB_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          VB_KEYSTORE_PASSWORD: ${{ secrets.VB_KEYSTORE_PASSWORD }}
          VB_KEY_ALIAS: ${{ secrets.VB_KEY_ALIAS }}
          VB_KEY_PASSWORD: ${{ secrets.VB_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Upload release AAB (if configured)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsebankirf-release-aab
          path: app/build/outputs/bundle/release/*.aab
